[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-escalation-referee-api"
version = "0.1.0"
description = "Backend for the Academic Escalation Referee demo"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "greenlet>=3.0,<4",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
