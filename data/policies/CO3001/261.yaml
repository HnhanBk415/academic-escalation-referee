version: "1.0.0"
status: ACTIVE
scope:
  course_id: CO3001
  semester: "261"
owner:
  lecturer_id: lecturer-01
  activated_by: lecturer-01
  activated_at: "2026-10-11T00:00:00Z"
change_note: "Policy thể thức ban đầu cho CO3001, học kỳ 261."

selection:
  mode: AUTO_COURSE_SEMESTER_THEN_REPORT_TYPE
  report_type_label: "Loại báo cáo"
  # Có nhiều profile ACTIVE nên UI phải hỏi loại báo cáo, sau khi course và semester
  # đã được suy ra từ ngữ cảnh sinh viên.
  prompt_when_active_profiles_greater_than: 1

source_documents:
  - document_id: co3001-format-guidelines-v1
    path: data/sample-documents/DACN/format-guidelines-v1.md
    version: v1
    sha256: 315d7757292e35359b4e290e82b4dd517567d96737407defd431e212d2de1c0a

report_profiles:
  - report_type: progress_report
    label: Báo cáo tiến độ đồ án
    status: DRAFT
    template:
      source_document_id: null
      path: null
      sha256: null
    rules: []
    note: >-
      Profile được tạo sẵn để minh họa một môn có nhiều loại báo cáo. Giảng viên phải
      bổ sung rule/template và kích hoạt trước khi sinh viên có thể dùng để pre-check.

  - report_type: final_project_report
    label: Báo cáo đồ án cuối kỳ
    status: ACTIVE
    template:
      source_document_id: co3001-format-guidelines-v1
      path: data/sample-documents/DACN/format-guidelines-v1.md
      sha256: 315d7757292e35359b4e290e82b4dd517567d96737407defd431e212d2de1c0a
    rules:
      - rule_id: FMT-CO3001-001
        title: Căn lề trang
        description: Lề trên/dưới 2.5 cm, trái 3.0 cm, phải 2.0 cm.
        rule_type: MEASUREMENT
        handling: BLOCKING
        automation: automatic
        expected:
          property: margins_cm
          value: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.0 }
          tolerance: 0.1
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 1 — Quy định về Khổ giấy và Căn lề"
        when_unable_to_check: UNABLE_TO_CHECK

      - rule_id: FMT-CO3001-002
        title: Phông chữ thân bài
        description: Dùng Times New Roman hoặc Arial nhất quán trong bài.
        rule_type: MEASUREMENT
        handling: BLOCKING
        automation: automatic
        expected:
          property: font_name
          allowed: ["Times New Roman", Arial]
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 2 — Phông chữ"
        when_unable_to_check: UNABLE_TO_CHECK

      - rule_id: FMT-CO3001-003
        title: Cỡ chữ thân bài
        description: Cỡ chữ thân bài là 12 pt hoặc 13 pt.
        rule_type: MEASUREMENT
        handling: BLOCKING
        automation: automatic
        expected:
          property: font_size_pt
          allowed: [12, 13]
          tolerance: 0.25
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 2 — Cỡ chữ"
        when_unable_to_check: UNABLE_TO_CHECK

      - rule_id: FMT-CO3001-004
        title: Giãn dòng thân bài
        description: Giãn dòng trong khoảng 1.3 đến 1.5 lines.
        rule_type: MEASUREMENT
        handling: ADVISORY
        automation: automatic
        expected:
          property: line_spacing
          min: 1.3
          max: 1.5
          tolerance: 0.05
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 2 — Khoảng cách dòng"
        when_unable_to_check: UNABLE_TO_CHECK

      - rule_id: FMT-CO3001-005
        title: Trang bìa chính
        description: Có trang bìa chứa thông tin trường/khoa, đề tài, học phần, GVHD, sinh viên và năm.
        rule_type: PRESENCE
        handling: BLOCKING
        automation: automatic
        expected:
          kind: cover_page
          required_elements: [school, faculty, project_title, course, lecturer, students, year]
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 5 — Trang bìa chính"
        when_unable_to_check: NEEDS_REVIEW

      - rule_id: FMT-CO3001-006
        title: Bảng phân công đóng góp thành viên
        description: Có bảng đóng góp với STT, họ tên, MSSV, nhiệm vụ, tỷ lệ đóng góp và chữ ký.
        rule_type: PRESENCE
        handling: BLOCKING
        automation: automatic
        expected:
          kind: table_columns
          required_columns: ["STT", "Họ và tên", MSSV, "Nhiệm vụ", "Tỷ lệ đóng góp", "Chữ ký"]
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 4 — Bảng phân công đóng góp thành viên"
        when_unable_to_check: NEEDS_REVIEW

      - rule_id: FMT-CO3001-007
        title: Các chương bắt buộc
        description: Có Chương 1, Chương 2, Chương 3 và phần Tài liệu tham khảo.
        rule_type: TEMPLATE
        handling: BLOCKING
        automation: automatic
        expected:
          kind: template_outline
          outline_headings:
            - "Chương 1: Khái niệm"
            - "Chương 2: Hiện thực"
            - "Chương 3: Đánh giá và Kết luận"
            - "Tài liệu tham khảo"
          allow_extra: true
          strict_names: false
          semantic_equivalence: true
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 5 — Khung Cấu trúc Báo cáo Bắt buộc"
        when_unable_to_check: NEEDS_REVIEW

      - rule_id: FMT-CO3001-008
        title: Chuẩn trích dẫn IEEE
        description: Tài liệu tham khảo phải tuân theo chuẩn IEEE.
        rule_type: PRESENCE
        handling: MANUAL_REVIEW
        automation: manual
        expected:
          kind: reference_style
          value: IEEE
        source:
          document_id: co3001-format-guidelines-v1
          citation: "Mục 5 — Tài liệu tham khảo"
        when_unable_to_check: NEEDS_REVIEW

history:
  - version: "1.0.0"
    status: ACTIVE
    activated_at: "2026-10-11T00:00:00Z"
    activated_by: lecturer-01
    change_note: "Khởi tạo policy cho báo cáo đồ án cuối kỳ."
