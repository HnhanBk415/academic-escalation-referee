schema_version: "1.0"
kind: format_policy_base
policy_id: format-policy-base
title: Quy ước chung cho pre-check thể thức báo cáo
status: ACTIVE

# File này chỉ định nghĩa contract chung. Giá trị thể thức cụ thể phải nằm trong
# policy của môn + học kỳ; không áp một template chung cho mọi môn.
selection:
  mode: AUTO_COURSE_SEMESTER_THEN_REPORT_TYPE
  reject_when_no_matching_active_profile: true
  never_fallback_to_another_report_type: true

rule_types:
  - MEASUREMENT
  - PRESENCE
  - TEMPLATE

rule_handling:
  BLOCKING:
    description: Lỗi rule làm kết quả pre-check là NEEDS_FIX.
  ADVISORY:
    description: Chỉ gợi ý cải thiện, không chặn bài.
  MANUAL_REVIEW:
    description: Cần giảng viên xác nhận; máy không tự kết luận đạt/không đạt.

precheck_results:
  PASS:
    description: Không có lỗi BLOCKING và không cần giảng viên xem.
  NEEDS_FIX:
    description: Có ít nhất một lỗi BLOCKING với bằng chứng rõ ràng.
  NEEDS_REVIEW:
    description: Có rule MANUAL_REVIEW hoặc bằng chứng mơ hồ cần giảng viên quyết định.
  UNABLE_TO_CHECK:
    description: Không thể đọc hay đánh giá đầu vào một cách đáng tin cậy.

evidence_requirements:
  - Mỗi rule phải có rule_id ổn định, title, handling, expected và source.
  - Kết quả fail/needs_review phải nêu expected, actual hoặc lý do không đo được.
  - Không suy diễn nội dung quy định khi source không có căn cứ.

retention:
  preserve_precheck_policy_snapshot: true
  preserve_superseded_policy_versions: true
  audit_events_required:
    - FORMAT_POLICY_CREATED
    - FORMAT_POLICY_ACTIVATED
    - FORMAT_POLICY_SUPERSEDED
