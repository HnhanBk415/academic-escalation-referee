<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1320" />
    <title>Academic Escalation Referee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Roboto"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"Roboto Mono"', 'monospace'],
            },
            colors: {
              surface: 'var(--surface)',
              'surface-dim': 'var(--surface-dim)',
              'surface-container': 'var(--surface-container)',
              'surface-container-high': 'var(--surface-container-high)',
              'on-surface': 'var(--on-surface)',
              'on-surface-variant': 'var(--on-surface-variant)',
              outline: 'var(--outline)',
              primary: 'var(--primary)',
              'on-primary': 'var(--on-primary)',
              'primary-container': 'var(--primary-container)',
            },
            borderRadius: {
              sm: 'var(--radius-sm)',
              md: 'var(--radius-md)',
              lg: 'var(--radius-lg)',
              xl: 'var(--radius-xl)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F6F8FC] text-[#1F1F1F] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
