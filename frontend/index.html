<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1320" />
    <title>AER System - Academic Escalation Referee | Hệ Thống AI Thẩm Định Học Thuật</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"Roboto Mono"', 'monospace'],
            },
            colors: {
              ruby: {
                50: '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48',
                700: '#be123c',
                800: '#9f1239',
                900: '#881337',
                950: '#4c0519',
              },
              softpink: {
                50: '#fdf8f8',
                100: '#fbeff1',
                200: '#f8e2e6',
                300: '#f2ccd4',
                400: '#e9acba',
              },
              surface: 'var(--surface)',
              'surface-dim': 'var(--surface-dim)',
              'surface-container-lowest': 'var(--surface-container-lowest)',
              'surface-container-low': 'var(--surface-container-low)',
              'surface-container': 'var(--surface-container)',
              'surface-container-high': 'var(--surface-container-high)',
              'surface-container-highest': 'var(--surface-container-highest)',
              'on-surface': 'var(--on-surface)',
              'on-surface-variant': 'var(--on-surface-variant)',
              outline: 'var(--outline)',
              'outline-variant': 'var(--outline-variant)',
              primary: 'var(--primary)',
              'on-primary': 'var(--on-primary)',
              'primary-container': 'var(--primary-container)',
              'on-primary-container': 'var(--on-primary-container)',
              secondary: 'var(--secondary)',
              'secondary-container': 'var(--secondary-container)',
              error: 'var(--error)',
              'error-container': 'var(--error-container)',
            },
            boxShadow: {
              'soft-card': '0 10px 30px -5px rgba(190, 18, 60, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03)',
              'ruby-glow': '0 14px 28px -6px rgba(190, 18, 60, 0.35)',
            },
            borderRadius: {
              sm: 'var(--radius-sm)',
              md: 'var(--radius-md)',
              lg: 'var(--radius-lg)',
              xl: 'var(--radius-xl)',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#faf7f8] text-[#2b1c1e] antialiased selection:bg-rose-200 selection:text-ruby-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
