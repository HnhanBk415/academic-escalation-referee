services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aer
      POSTGRES_USER: aer
      POSTGRES_PASSWORD: aer
    ports:
      - "${AER_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aer -d aer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aer-postgres:/var/lib/postgresql/data

volumes:
  aer-postgres:
