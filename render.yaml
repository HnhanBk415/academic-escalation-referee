services:
  - type: web
    name: academic-escalation-referee-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: password
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AUTH_USERS_JSON
        sync: false
      - key: AUTH_TOKEN_TTL_MINUTES
        value: "480"
      - key: AI_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: AI_HEALTH_CACHE_SECONDS
        value: "45"
      - key: PROMPT_VERSION
        value: referee-v3-structured-exceptions
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
