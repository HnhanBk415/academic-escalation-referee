services:
  - type: web
    name: academic-escalation-referee-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: PROMPT_VERSION
        value: referee-v1
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
